PACKAGE_NAME="saturn-xdma"
PACKAGE_VERSION="2020.1.8-saturn"

BUILT_MODULE_NAME[0]="xdma"
BUILT_MODULE_LOCATION[0]="xdma"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# DKMS prepends KERNELRELEASE=<release> when a recipe begins with "make".
# The XDMA wrapper Makefile interprets that as an invocation from Kbuild and
# exposes no standalone target.  Prefix the wrapper command with env so DKMS
# leaves it alone; Kbuild will set KERNELRELEASE in its own make process.
MAKE[0]="env -u KERNELRELEASE make -C xdma KDIR=/lib/modules/${kernelver}/build"
CLEAN="env -u KERNELRELEASE make -C xdma KDIR=/lib/modules/${kernelver}/build clean"

AUTOINSTALL="yes"
