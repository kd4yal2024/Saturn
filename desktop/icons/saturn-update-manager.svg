<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Saturn Go desktop icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"></stop>
      <stop offset="100%" stop-color="#1E293B"></stop>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"></stop>
      <stop offset="100%" stop-color="#22D3EE"></stop>
    </linearGradient>

    <linearGradient id="wf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"></stop>
      <stop offset="50%" stop-color="#22D3EE"></stop>
      <stop offset="100%" stop-color="#10B981"></stop>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"></rect>

  <!-- Inner panel -->
  <rect x="28" y="28" width="200" height="200" rx="36" fill="#111827" opacity="0.92"></rect>

  <!-- Saturn RF ring -->
  <ellipse cx="128" cy="96" rx="72" ry="26" fill="none" stroke="url(#ring)" stroke-width="11" transform="rotate(-12 128 96)" stroke-linecap="round" filter="url(#softGlow)"></ellipse>

  <!-- Antenna mast -->
  <path d="M128 58 L128 150" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"></path>
  <circle cx="128" cy="50" r="9" fill="#FFFFFF"></circle>

  <!-- Tower legs -->
  <path d="M128 150 L96 188" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"></path>
  <path d="M128 150 L160 188" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"></path>

  <!-- Base line -->
  <path d="M88 188 H168" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"></path>

  <!-- Small cross braces -->
  <path d="M116 98 H140" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" opacity="0.9"></path>
  <path d="M110 122 H146" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" opacity="0.9"></path>

  <!-- Waterfall / SDR strip -->
  <g transform="translate(52 198)">
    <rect x="0" y="0" width="152" height="16" rx="8" fill="#0B1220"></rect>
    <rect x="6" y="3" width="16" height="10" rx="3" fill="url(#wf)" opacity="0.85"></rect>
    <rect x="26" y="3" width="11" height="10" rx="3" fill="url(#wf)" opacity="0.55"></rect>
    <rect x="41" y="3" width="20" height="10" rx="3" fill="url(#wf)" opacity="0.95"></rect>
    <rect x="65" y="3" width="12" height="10" rx="3" fill="url(#wf)" opacity="0.45"></rect>
    <rect x="81" y="3" width="26" height="10" rx="3" fill="url(#wf)" opacity="1"></rect>
    <rect x="111" y="3" width="10" height="10" rx="3" fill="url(#wf)" opacity="0.5"></rect>
    <rect x="125" y="3" width="21" height="10" rx="3" fill="url(#wf)" opacity="0.8"></rect>
  </g>

  <!-- Tiny update status accent -->
  <circle cx="198" cy="58" r="10" fill="#10B981"></circle>
</svg>