#cloud-config
hostname: saturn-g2
manage_etc_hosts: true

package_update: false
package_upgrade: false

write_files:
  - path: /etc/default/saturn-provision
    permissions: "0644"
    owner: root:root
    content: |
      # Primary provisioning target
      SATURN_USER=pi
      # Retry cadence while waiting for SATURN_USER to exist and have a home dir.
      SATURN_USER_RETRY_SECONDS=30
      # Wait for NTP/system clock sync before first apt/git activity.
      # Set to 0 to skip the wait.
      SATURN_CLOCK_SYNC_WAIT_SECONDS=180
      SATURN_CLOCK_SYNC_POLL_SECONDS=5
      SATURN_REPO_URL=https://github.com/kd4yal2024/Saturn.git
      SATURN_REPO_BRANCH=main

      # Feature toggles
      SATURN_INSTALL_UPDATE_MANAGER=1
      SATURN_INSTALL_PIHPSDR=1
      SATURN_INSTALL_SATURN_BRIDGE=1
      SATURN_REQUIRE_SATURN_BRIDGE=1
      SATURN_INSTALL_P2APP_CONTROL=1
      SATURN_INSTALL_UDEV_RULES=1
      SATURN_INSTALL_SHUTDOWN_WAITER=1
      SATURN_SHUTDOWN_WAITER_ENABLED_DEFAULT=auto
      SATURN_REBUILD_XDMA=1
      SATURN_BUILD_OPTIONAL_TOOLS=1
      SATURN_ENABLE_I2C=1
      SATURN_ENABLE_SSH=1
      SATURN_ENABLE_VNC=1

      # LCD boot profile (managed block appended to config.txt; existing HDMI lines are preserved)
      # Valid: none | cm4-7 | cm4-7-custom-jd | cm4-7-g2-single-dsi | cm4-8 | cm5-7 | cm5-7-g2-single-dsi | cm5-7-g2-dual-dsi | cm5-8 | auto
      # Note: auto currently requires an explicit/manual choice for CM5 + 7" paths.
      SATURN_LCD_PROFILE=auto
      # Optional override when auto mode cannot infer size (values: 7 or 8)
      # SATURN_LCD_SIZE_INCH=8
      # Optional fallback when auto detection is ambiguous (values: 7 or 8)
      # SATURN_LCD_AUTO_DEFAULT_SIZE_INCH=7
      # I2C address used by auto probe (default 0x45)
      # SATURN_LCD_I2C_DETECT_ADDR=0x45
      # Detect-only mode for safe validation (1 = detect/log only, no config.txt writes)
      # SATURN_LCD_DETECT_ONLY=0

      # Optional desktop provisioning UI (C++/GTK)
      # auto = launch when desktop/X11 is available
      # 1    = force launch attempt
      # 0    = disable
      SATURN_DESKTOP_UI=auto
      SATURN_UI_TIMEOUT_SECONDS=2700
      SATURN_UI_SHOW_LOG_DEFAULT=0

      # FPGA flash is OFF by default for safety.
      SATURN_FLASH_FPGA=0
      SATURN_FLASH_IMAGE=latest
      SATURN_FLASH_FALLBACK=0
      # Required if SATURN_FLASH_FPGA=1:
      # SATURN_FLASH_CONFIRM=FLASH

      # Optional: set explicit admin password for Update Manager basic auth.
      # Blank keeps the provisioning default admin/admin login for first access.
      SATURN_ADMIN_PASSWORD=

      # Re-run on every boot only if explicitly requested.
      SATURN_FORCE_REPROVISION=0

      # Detect front-panel hardware during provisioning and record G2V1/G2V2/NONE.
      SATURN_DETECT_FRONT_PANEL=1
  - path: /usr/local/sbin/saturn-cloudinit-bootstrap.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      LOG_FILE="/var/log/saturn-cloudinit-bootstrap.log"
      exec > >(tee -a "$LOG_FILE") 2>&1

      echo "[$(date '+%Y-%m-%d %H:%M:%S')] Saturn cloud-init bootstrap starting"

      source /etc/default/saturn-provision

      retry_seconds="${SATURN_USER_RETRY_SECONDS:-30}"
      if ! [[ "$retry_seconds" =~ ^[0-9]+$ ]] || (( retry_seconds < 1 )); then
        retry_seconds=30
      fi

      clock_wait_seconds_raw="${SATURN_CLOCK_SYNC_WAIT_SECONDS:-180}"
      clock_wait_seconds="$clock_wait_seconds_raw"
      if ! [[ "$clock_wait_seconds" =~ ^[0-9]+$ ]] || (( clock_wait_seconds < 0 || clock_wait_seconds > 3600 )); then
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] WARN: SATURN_CLOCK_SYNC_WAIT_SECONDS='${clock_wait_seconds_raw}' is invalid; using 180 (valid range: 0..3600)."
        clock_wait_seconds=180
      fi

      clock_poll_seconds="${SATURN_CLOCK_SYNC_POLL_SECONDS:-5}"
      if ! [[ "$clock_poll_seconds" =~ ^[0-9]+$ ]] || (( clock_poll_seconds < 1 )); then
        clock_poll_seconds=5
      fi

      clock_is_synchronized() {
        local ntp_sync="" system_sync=""
        command -v timedatectl >/dev/null 2>&1 || return 1
        ntp_sync="$(timedatectl show -p NTPSynchronized --value 2>/dev/null || true)"
        system_sync="$(timedatectl show -p SystemClockSynchronized --value 2>/dev/null || true)"
        [[ "$ntp_sync" == "yes" || "$system_sync" == "yes" ]]
      }

      wait_for_clock_sync() {
        local elapsed=0

        if (( clock_wait_seconds == 0 )); then
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] SATURN_CLOCK_SYNC_WAIT_SECONDS=0; skipping clock sync wait."
          return 0
        fi

        if ! command -v timedatectl >/dev/null 2>&1; then
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] WARN: timedatectl not available; skipping explicit clock sync wait."
          return 0
        fi

        if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files systemd-timesyncd.service >/dev/null 2>&1; then
          systemctl start systemd-timesyncd.service >/dev/null 2>&1 || true
        fi

        until clock_is_synchronized; do
          if (( elapsed >= clock_wait_seconds )); then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: timed out waiting ${clock_wait_seconds}s for system clock synchronization."
            echo "Provisioning stops here because incorrect time can break apt signature verification and HTTPS git clone."
            echo "Bring up network time or set SATURN_CLOCK_SYNC_WAIT_SECONDS=0 to bypass this guard explicitly."
            return 1
          fi
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Waiting for system clock sync before first apt/git activity..."
          sleep "$clock_poll_seconds"
          elapsed=$((elapsed + clock_poll_seconds))
        done

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] System clock synchronized; continuing bootstrap."
      }

      find_fallback_user() {
        getent passwd | awk -F: '
          $1 != "nobody" &&
          $3 >= 1000 && $3 < 60000 &&
          $6 ~ "^/home/" {
            print $1 ":" $6
            exit
          }
        '
      }

      ensure_bootstrap_packages() {
        local missing=()

        command -v git >/dev/null 2>&1 || missing+=(git)
        command -v sudo >/dev/null 2>&1 || missing+=(sudo)
        dpkg -s ca-certificates >/dev/null 2>&1 || missing+=(ca-certificates)

        if (( ${#missing[@]} == 0 )); then
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Bootstrap packages already present."
          return 0
        fi

        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Installing bootstrap packages: ${missing[*]}"
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends "${missing[@]}"
      }

      wait_for_clock_sync
      ensure_bootstrap_packages

      SATURN_HOME=""
      for _attempt in $(seq 1 20); do
        SATURN_HOME="$(getent passwd "$SATURN_USER" | cut -d: -f6 || true)"
        if [[ -n "$SATURN_HOME" ]]; then
          break
        fi
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Waiting for SATURN_USER '$SATURN_USER' to exist..."
        sleep "$retry_seconds"
      done

      if [[ -z "$SATURN_HOME" ]]; then
        fallback="$(find_fallback_user || true)"
        if [[ -n "$fallback" ]]; then
          SATURN_USER="${fallback%%:*}"
          SATURN_HOME="${fallback#*:}"
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] WARN: configured SATURN_USER was missing; falling back to detected login user '$SATURN_USER' ($SATURN_HOME)."
        else
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: SATURN_USER '$SATURN_USER' was not created before bootstrap ran."
          echo "On current cloud-init based Raspberry Pi OS images, make sure the active user-data still creates the login user and that it matches SATURN_USER."
          exit 1
        fi
      fi

      install -d -m 0755 -o "$SATURN_USER" -g "$SATURN_USER" "$SATURN_HOME/github"

      if [[ ! -d "$SATURN_HOME/github/Saturn/.git" ]]; then
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Cloning Saturn repo"
        sudo -u "$SATURN_USER" -H git clone --depth 1 --branch "$SATURN_REPO_BRANCH" "$SATURN_REPO_URL" "$SATURN_HOME/github/Saturn"
      else
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Updating existing Saturn repo"
        sudo -u "$SATURN_USER" -H git -C "$SATURN_HOME/github/Saturn" fetch --depth 1 origin "$SATURN_REPO_BRANCH"
        sudo -u "$SATURN_USER" -H git -C "$SATURN_HOME/github/Saturn" checkout -B "$SATURN_REPO_BRANCH" "origin/$SATURN_REPO_BRANCH"
      fi

      echo "[$(date '+%Y-%m-%d %H:%M:%S')] Launching Saturn provisioning"
      exec bash "$SATURN_HOME/github/Saturn/provision/cloud-init/provision-saturn.sh"

runcmd:
  - [bash, -lc, "/usr/local/sbin/saturn-cloudinit-bootstrap.sh"]

final_message: "Saturn provisioning complete. Review /var/log/saturn-provision.log and /var/lib/saturn-provision/complete"
