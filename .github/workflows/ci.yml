name: Saturn CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: saturn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: update_manager/rust-server
            run_tests: true
          - crate: update_manager/saturn-bridge
            run_tests: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt -- --check
        working-directory: ${{ matrix.crate }}

      - name: Clippy correctness check
        if: ${{ matrix.crate == 'update_manager/rust-server' }}
        run: cargo clippy --locked --no-deps -- -D clippy::correctness -D clippy::suspicious
        working-directory: ${{ matrix.crate }}

      - name: Test
        if: ${{ matrix.run_tests }}
        run: cargo test --locked
        working-directory: ${{ matrix.crate }}

      - name: Test with native DSP stubs
        if: ${{ matrix.run_tests == false }}
        env:
          SATURN_BRIDGE_STUB_NATIVE: "1"
        run: cargo test --locked
        working-directory: ${{ matrix.crate }}

  rust-supply-chain:
    name: Rust supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache supply-chain tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-supply-chain-tools-v1

      - name: Install supply-chain tools
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked

      - name: Audit and check dependency policy
        run: |
          for crate in update_manager/rust-server update_manager/saturn-bridge; do
            echo "::group::${crate}"
            (
              cd "$crate"
              cargo audit --deny warnings
              cargo deny check --config ../deny.toml advisories bans sources
            )
            echo "::endgroup::"
          done


  remote-web:
    name: Remote web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: update_manager/remote-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: update_manager/remote-web

      - name: Typecheck
        run: npm run typecheck
        working-directory: update_manager/remote-web

      - name: Check template/bundle seam
        run: npm run check:seam
        working-directory: update_manager/remote-web

      - name: Test
        run: npm test
        working-directory: update_manager/remote-web

      - name: Build
        run: npm run build
        working-directory: update_manager/remote-web

  native:
    name: Native apps and XDMA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dkms \
            linux-headers-$(uname -r) \
            libi2c-dev \
            libgpiod-dev \
            pkg-config \
            cppcheck \
            shellcheck

      - name: Check provisioning shell
        run: |
          shellcheck \
            scripts/install-saturn-appliance.sh \
            scripts/fix-xdma.sh \
            scripts/install-xdma-dkms.sh \
            update_manager/scripts/saturn-go-deploy-root.sh \
            update_manager/scripts/saturn-tailscale.sh
          bash -n \
            scripts/install-saturn-appliance.sh \
            scripts/fix-xdma.sh \
            scripts/install-xdma-dkms.sh \
            update_manager/scripts/saturn-go-deploy-root.sh \
            update_manager/scripts/update-saturn-go.sh \
            update_manager/install_saturn_go_nginx.sh \
            sw_tools/p2app-control/install.sh

      - name: Test deployment broker policy
        run: tests/test-saturn-go-deploy-broker.sh

      - name: Test P2 controller lease
        run: make test-controller-lease-asan
        working-directory: sw_projects/P2_app

      - name: Test P2 command boundary
        run: make test-protocol2-control test-protocol2-command-asan
        working-directory: sw_projects/P2_app

      - name: P2 static analysis
        run: make cppcheck-ci
        working-directory: sw_projects/P2_app

      - name: Build P2 app
        run: make clean all
        working-directory: sw_projects/P2_app

      - name: Build P1 app
        run: make clean all
        working-directory: sw_projects/P1_app

      - name: Build P3 app
        run: make clean all
        working-directory: sw_projects/P3_app

      - name: Build XDMA module
        run: make clean all
        working-directory: linuxdriver/xdma

      - name: Check XDMA DKMS packaging
        run: |
          bash -n scripts/install-xdma-dkms.sh
          scripts/install-xdma-dkms.sh --dry-run --kernel "$(uname -r)"

      - name: Check direct appliance installer
        run: scripts/install-saturn-appliance.sh --dry-run --user "$(id -un)" --skip-packages --skip-driver --skip-p2 --skip-saturn-go
