name: Saturn CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: saturn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: update_manager/rust-server
            run_tests: true
          - crate: update_manager/saturn-bridge
            run_tests: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt -- --check
        working-directory: ${{ matrix.crate }}

      - name: Test
        if: ${{ matrix.run_tests }}
        run: cargo test --locked
        working-directory: ${{ matrix.crate }}

      - name: Skip native-link tests
        if: ${{ matrix.run_tests == false }}
        run: |
          echo "saturn-bridge links WDSP/RNNoise/SpecBleach static libraries from the local piHPSDR tree."
          echo "GitHub-hosted runners do not have ../../../pihpsdr/wdsp/libwdsp.a, so CI format-checks this crate here."
          echo "Run cargo test --locked on a Saturn build host with the piHPSDR static libraries installed."

  rust-supply-chain:
    name: Rust supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache supply-chain tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-supply-chain-tools-v1

      - name: Install supply-chain tools
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked

      - name: Audit and check dependency policy
        run: |
          for crate in update_manager/rust-server update_manager/saturn-bridge; do
            echo "::group::${crate}"
            (
              cd "$crate"
              cargo audit --deny warnings
              cargo deny check --config ../deny.toml advisories bans sources
            )
            echo "::endgroup::"
          done


  remote-web:
    name: Remote web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: update_manager/remote-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: update_manager/remote-web

      - name: Typecheck
        run: npm run typecheck
        working-directory: update_manager/remote-web

      - name: Test
        run: npm test
        working-directory: update_manager/remote-web

      - name: Build
        run: npm run build
        working-directory: update_manager/remote-web

  native:
    name: Native apps and XDMA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dkms \
            linux-headers-$(uname -r) \
            libi2c-dev \
            libgpiod-dev \
            pkg-config

      - name: Build P2 app
        run: make clean all
        working-directory: sw_projects/P2_app

      - name: Build P3 app
        run: make clean all
        working-directory: sw_projects/P3_app

      - name: Build XDMA module
        run: make clean all
        working-directory: linuxdriver/xdma

      - name: Check XDMA DKMS packaging
        run: |
          bash -n scripts/install-xdma-dkms.sh
          scripts/install-xdma-dkms.sh --dry-run --kernel "$(uname -r)"
