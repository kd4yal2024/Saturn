name: Saturn CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: saturn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: update_manager/rust-server
            run_tests: true
          - crate: update_manager/saturn-bridge
            run_tests: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt -- --check
        working-directory: ${{ matrix.crate }}

      - name: Clippy correctness check
        if: ${{ matrix.crate == 'update_manager/rust-server' }}
        run: cargo clippy --locked --no-deps -- -D clippy::correctness -D clippy::suspicious
        working-directory: ${{ matrix.crate }}

      - name: Test
        if: ${{ matrix.run_tests }}
        run: cargo test --locked
        working-directory: ${{ matrix.crate }}

      - name: Test with native DSP stubs
        if: ${{ matrix.run_tests == false }}
        env:
          SATURN_BRIDGE_STUB_NATIVE: "1"
        run: cargo test --locked
        working-directory: ${{ matrix.crate }}

  rust-supply-chain:
    name: Rust supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache supply-chain tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-supply-chain-tools-v1

      - name: Install supply-chain tools
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked

      - name: Audit and check dependency policy
        run: |
          for crate in update_manager/rust-server update_manager/saturn-bridge; do
            echo "::group::${crate}"
            (
              cd "$crate"
              cargo audit --deny warnings
              cargo deny check --config ../deny.toml advisories bans sources
            )
            echo "::endgroup::"
          done


  remote-web:
    name: Remote web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: update_manager/remote-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: update_manager/remote-web

      - name: Typecheck
        run: npm run typecheck
        working-directory: update_manager/remote-web

      - name: Check template/bundle seam
        run: npm run check:seam
        working-directory: update_manager/remote-web

      - name: Test
        run: npm test
        working-directory: update_manager/remote-web

      - name: Build
        run: npm run build
        working-directory: update_manager/remote-web

  native:
    name: Native apps and XDMA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dkms \
            linux-headers-$(uname -r) \
            libi2c-dev \
            libgpiod-dev \
            pkg-config \
            cppcheck \
            shellcheck \
            cloud-init \
            apache2-utils

      - name: Check provisioning shell
        run: |
          shellcheck \
            install.sh \
            scripts/install-saturn-appliance.sh \
            scripts/update-p2app.sh \
            scripts/saturn-p2-deploy.sh \
            scripts/saturn-first-boot.sh \
            scripts/seal-saturn-image.sh \
            scripts/saturn-admin-password.sh \
            scripts/install-shutdown-waiter-service.sh \
            scripts/fix-LED-power-button.sh \
            scripts/fix-xdma.sh \
            scripts/install-xdma-dkms.sh \
            provision/cloud-init/provision-saturn.sh \
            update_manager/install_saturn_go_nginx.sh \
            update_manager/scripts/install-saturn-bridge.sh \
            update_manager/scripts/saturn-release-activate-root.sh \
            update_manager/scripts/saturn-release-install-root.sh \
            update_manager/scripts/update-saturn-go.sh \
            update_manager/scripts/saturn-go-build-preflight.sh \
            update_manager/scripts/saturn-release-build.sh \
            update_manager/scripts/saturn-go-deploy-root.sh \
            update_manager/scripts/saturn-xdma-phase4-stress.sh \
            update_manager/scripts/saturn-tailscale.sh \
            sw_tools/p2app-control/install.sh \
            tests/test-admin-password-policy.sh \
            tests/test-saturn-backup-types.sh \
            tests/test-saturn-atomic-state-write.sh \
            tests/test-disk-imaging-disabled.sh \
            tests/test-deskhpsdr-integration.sh \
            tests/test-provisioning-contract.sh \
            tests/test-request-body-limits.sh \
            tests/test-rust-low-memory-build.sh \
            tests/test-saturn-release-activate.sh \
            tests/test-saturn-release-install.sh \
            tests/test-saturn-release-manifest.sh \
            tests/test-saturn-release-source.sh \
            tests/test-saturn-maintenance-lock.sh \
            tests/test-saturn-maintenance-jobs.sh \
            tests/test-saturn-transactional-restore.sh \
            tests/test-saturn-state-inventory.sh \
            tests/test-saturn-state-compatibility.sh \
            tests/test-saturn-go-deploy-broker.sh \
            tests/test-saturn-p2-deploy.sh \
            tests/test-xdma-phase4-stress.sh \
            tests/test-xdma-realtime-completion.sh \
            tests/test-xdma-dkms-idempotency.sh
          bash -n \
            install.sh \
            scripts/install-saturn-appliance.sh \
            scripts/update-p2app.sh \
            scripts/saturn-p2-deploy.sh \
            scripts/saturn-first-boot.sh \
            scripts/seal-saturn-image.sh \
            scripts/saturn-admin-password.sh \
            scripts/install-shutdown-waiter-service.sh \
            scripts/fix-LED-power-button.sh \
            scripts/fix-xdma.sh \
            scripts/install-xdma-dkms.sh \
            provision/cloud-init/provision-saturn.sh \
            update_manager/scripts/install-saturn-bridge.sh \
            update_manager/scripts/saturn-release-activate-root.sh \
            update_manager/scripts/saturn-release-install-root.sh \
            update_manager/scripts/saturn-release-build.sh \
            update_manager/scripts/saturn-go-deploy-root.sh \
            update_manager/scripts/saturn-xdma-phase4-stress.sh \
            update_manager/scripts/update-saturn-go.sh \
            update_manager/install_saturn_go_nginx.sh \
            sw_tools/p2app-control/install.sh \
            tests/test-saturn-backup-types.sh \
            tests/test-saturn-atomic-state-write.sh \
            tests/test-rust-low-memory-build.sh \
            tests/test-saturn-release-activate.sh \
            tests/test-saturn-release-install.sh \
            tests/test-saturn-release-manifest.sh \
            tests/test-saturn-release-source.sh \
            tests/test-saturn-maintenance-lock.sh \
            tests/test-saturn-maintenance-jobs.sh \
            tests/test-saturn-transactional-restore.sh \
            tests/test-request-body-limits.sh \
            tests/test-saturn-state-inventory.sh \
            tests/test-saturn-state-compatibility.sh \
            tests/test-saturn-go-deploy-broker.sh \
            tests/test-xdma-phase4-stress.sh \
            tests/test-xdma-realtime-completion.sh \
            tests/test-xdma-dkms-idempotency.sh

      - name: Validate cloud-init configuration
        run: cloud-init schema --config-file provision/cloud-init/user-data.example.yaml

      - name: Test unified provisioning contract
        run: tests/test-provisioning-contract.sh

      - name: Test five-character admin password policy
        run: tests/test-admin-password-policy.sh

      - name: Test browser disk-imaging disablement
        run: tests/test-disk-imaging-disabled.sh

      - name: Test route-specific request body limits
        run: tests/test-request-body-limits.sh

      - name: Test separated backup types and exclusions
        run: tests/test-saturn-backup-types.sh

      - name: Test atomic persistent-state writes
        run: tests/test-saturn-atomic-state-write.sh

      - name: Test host-level maintenance resource locks
        run: tests/test-saturn-maintenance-lock.sh

      - name: Test durable maintenance job broker
        run: tests/test-saturn-maintenance-jobs.sh

      - name: Test low-memory Rust build safeguards
        run: tests/test-rust-low-memory-build.sh

      - name: Test application release manifest
        run: tests/test-saturn-release-manifest.sh

      - name: Test exact release source selection
        run: tests/test-saturn-release-source.sh

      - name: Test immutable release installation
        run: tests/test-saturn-release-install.sh

      - name: Test persistent-state compatibility and rollback
        run: tests/test-saturn-state-compatibility.sh

      - name: Test transactional settings and source restore recovery
        run: tests/test-saturn-transactional-restore.sh

      - name: Test persistent-state inventory and support exclusions
        run: tests/test-saturn-state-inventory.sh

      - name: Test atomic release activation transaction
        run: tests/test-saturn-release-activate.sh

      - name: Test deskHPSDR integration patches
        run: tests/test-deskhpsdr-integration.sh

      - name: Test production P2 deployment rollback
        run: tests/test-saturn-p2-deploy.sh

      - name: Test deployment broker policy
        run: tests/test-saturn-go-deploy-broker.sh

      - name: Test XDMA DKMS rerun behavior
        run: tests/test-xdma-dkms-idempotency.sh

      - name: Test XDMA Phase 4 stress safety contract
        run: tests/test-xdma-phase4-stress.sh

      - name: Test XDMA real-time completion contract
        run: tests/test-xdma-realtime-completion.sh

      - name: Test P2 controller lease
        run: make test-controller-lease-asan
        working-directory: sw_projects/P2_app

      - name: Test P2 command boundary
        run: make test-protocol2-control test-protocol2-command-asan test-protocol2-high-priority-asan
        working-directory: sw_projects/P2_app

      - name: P2 static analysis
        run: make cppcheck-ci
        working-directory: sw_projects/P2_app

      - name: Build P2 app
        run: make clean all
        working-directory: sw_projects/P2_app

      - name: Build P1 app
        run: make clean all
        working-directory: sw_projects/P1_app

      - name: Build P3 app
        run: make clean all
        working-directory: sw_projects/P3_app

      - name: Build XDMA module
        run: make clean all
        working-directory: linuxdriver/xdma

      - name: Check XDMA DKMS packaging
        run: |
          bash -n scripts/install-xdma-dkms.sh
          scripts/install-xdma-dkms.sh --dry-run --kernel "$(uname -r)"
          kernelver="$(uname -r)"
          source linuxdriver/dkms/dkms.conf
          (
            cd linuxdriver
            bash -c "$CLEAN"
            dkms_make="${MAKE[0]/#make/make -j2 KERNELRELEASE=$kernelver}"
            bash -c "$dkms_make"
            test -s xdma/xdma.ko
          )

      - name: Check direct appliance installer
        run: ./install.sh --dry-run --user "$(id -un)" --profile appliance
