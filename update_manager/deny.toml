# Saturn Rust supply-chain policy: see docs/RUST_SUPPLY_CHAIN.md.
# Run from each Rust crate after dependency changes:
#   cargo audit --deny warnings
#   cargo deny check --config ../deny.toml advisories bans sources

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
