# Explicit CM4 shared-PureSignal trial profile, verified on Jerry's G2.
# P2 app v52 already implements these options. No P2 app binary change.
# Three existing audio threads use RR/10 on CPU2; other threads are unchanged.
[Service]
Environment=SATURN_P3_RT_AUDIO_ENABLE=1
Environment=SATURN_P3_RT_AUDIO_POLICY=rr
Environment=SATURN_P3_RT_AUDIO_PRIORITY=10
Environment=SATURN_P3_RT_AUDIO_CPUS=2
