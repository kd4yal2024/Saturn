[package]
name = "saturn-bridge"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
# Review-only offline experiment. No production caller selects this policy.
offline-puresignal-policy-proposal = []
offline-puresignal-tx-lifecycle = ["offline-puresignal-policy-proposal"]
# Stop-boundary review against real UDP/file-backed output methods. No live wiring.
offline-puresignal-owner-adapters = ["offline-puresignal-tx-lifecycle"]
offline-puresignal-owner-native = ["offline-puresignal-owner-adapters"]
# Explicit host integration; never selected by default. Requires the pinned
# native observer/archive and an explicit acquisition/admission contract.
managed-puresignal = ["offline-puresignal-owner-native"]

[dependencies]
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
tungstenite = "=0.29.0"

[profile.release]
# Preserve Rust/WDSP numerical behavior while allowing cross-crate optimization
# of the bridge control, framing, conversion, and publication paths.
opt-level = 3
lto = "thin"
codegen-units = 1
